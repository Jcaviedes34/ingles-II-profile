<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Métodos Vergara</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="contenedor">
        <!-- Menú Lateral -->
        <aside class="sidebar">
            <h2>Temario JS</h2>
            
            <div class="menu-item">
                <button class="menu-btn">1. Expresiones Simples</button>
                <div class="submenu">
                    <button class="ejercicio-btn" data-ejercicio="exp1">1.1 Suma Básica</button>
                    <button class="ejercicio-btn" data-ejercicio="exp2">1.2 Área de Cuadrado</button>
                </div>
            </div>

            <div class="menu-item">
                <button class="menu-btn">2. Condicionales</button>
                <div class="submenu">
                    <button class="ejercicio-btn" data-ejercicio="cond1">2.1 Par o Impar</button>
                    <button class="ejercicio-btn" data-ejercicio="cond2">2.2 Mayor de Edad</button>
                </div>
            </div>

            <div class="menu-item">
                <button class="menu-btn">3. Cond. Anidados</button>
                <div class="submenu">
                    <button class="ejercicio-btn" data-ejercicio="anid1">3.1 Notas (Else If)</button>
                    <button class="ejercicio-btn" data-ejercicio="anid2">3.2 Perfil (If en If)</button>
                </div>
            </div>

            <div class="menu-item">
                <button class="menu-btn">4. Switch Case</button>
                <div class="submenu">
                    <button class="ejercicio-btn" data-ejercicio="sw1">4.1 Días de la Semana</button>
                    <button class="ejercicio-btn" data-ejercicio="sw2">4.2 Calculadora</button>
                </div>
            </div>

            <div class="menu-item">
                <button class="menu-btn">5. Ciclos</button>
                <div class="submenu">
                    <button class="ejercicio-btn" data-ejercicio="ciclo1">5.1 Sumatoria (For)</button>
                    <button class="ejercicio-btn" data-ejercicio="ciclo4">5.2 Edades (For)</button>
                    <button class="ejercicio-btn" data-ejercicio="ciclo2">5.3 Factorial (While)</button>
                    <button class="ejercicio-btn" data-ejercicio="ciclo3">5.4 Dígitos (Do While)</button>
                </div>
            </div>
        </aside>

        <!-- Área de visualización del ejercicio -->
        <main class="contenido-principal">
            <section id="area-ejercicio" class="tarjeta-ejercicio bienvenida">
                <h1>Bienvenido al afianzamiento en programación</h1>
                <p>Selecciona un ejercicio del menú lateral para comenzar.</p>
            </section>
        </main>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
